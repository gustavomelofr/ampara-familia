name: Build and upload iOS to TestFlight

on:
  workflow_dispatch:
    inputs:
      confirm_testflight_upload:
        description: Confirm that this build should be uploaded to TestFlight
        required: true
        type: boolean
        default: false
      message:
        description: Short label for this build
        required: false
        type: string
        default: Manual TestFlight build

permissions:
  contents: read

concurrency:
  group: ampara-ios-testflight
  cancel-in-progress: false

jobs:
  build-and-submit:
    if: ${{ inputs.confirm_testflight_upload }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - name: Check out app
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Run checks
        run: |
          npm run typecheck
          npm test
          npx expo install --check

      - name: Generate the iOS project
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Install CocoaPods dependencies
        run: pod install --project-directory=ios

      - name: Install Apple signing assets
        shell: bash
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          : "${IOS_DISTRIBUTION_CERTIFICATE_BASE64:?Add the IOS_DISTRIBUTION_CERTIFICATE_BASE64 GitHub secret}"
          : "${IOS_DISTRIBUTION_CERTIFICATE_PASSWORD:?Add the IOS_DISTRIBUTION_CERTIFICATE_PASSWORD GitHub secret}"
          : "${IOS_APP_STORE_PROFILE_BASE64:?Add the IOS_APP_STORE_PROFILE_BASE64 GitHub secret}"

          keychain_path="$RUNNER_TEMP/ampara-signing.keychain-db"
          keychain_password="$(openssl rand -hex 32)"
          p12_path="$RUNNER_TEMP/distribution.p12"
          profile_path="$RUNNER_TEMP/app-store.mobileprovision"
          profile_plist="$RUNNER_TEMP/app-store-profile.plist"

          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | base64 -D > "$p12_path"
          printf '%s' "$IOS_APP_STORE_PROFILE_BASE64" | base64 -D > "$profile_path"

          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security import "$p12_path" \
            -k "$keychain_path" \
            -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s \
            -k "$keychain_password" \
            "$keychain_path"
          security list-keychains -d user -s "$keychain_path"

          security cms -D -i "$profile_path" > "$profile_plist"
          profile_uuid="$(/usr/libexec/PlistBuddy -c 'Print UUID' "$profile_plist")"
          profile_name="$(/usr/libexec/PlistBuddy -c 'Print Name' "$profile_plist")"
          team_id="$(/usr/libexec/PlistBuddy -c 'Print :TeamIdentifier:0' "$profile_plist")"
          application_identifier="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$profile_plist")"

          if [[ "$application_identifier" != "$team_id.com.gustavo.ampara" ]]; then
            echo "The App Store provisioning profile does not match com.gustavo.ampara." >&2
            exit 1
          fi

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile_path" "$HOME/Library/MobileDevice/Provisioning Profiles/$profile_uuid.mobileprovision"

          {
            printf 'IOS_PROFILE_UUID=%s\n' "$profile_uuid"
            printf 'IOS_PROFILE_NAME=%s\n' "$profile_name"
            printf 'APPLE_TEAM_ID=%s\n' "$team_id"
          } >> "$GITHUB_ENV"

          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          if [[ "$identities" != *"Apple Distribution"* ]]; then
            echo "The .p12 does not contain a valid Apple Distribution identity." >&2
            exit 1
          fi

      - name: Prepare App Store Connect API key
        shell: bash
        env:
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          : "${ASC_API_KEY_BASE64:?Add the ASC_API_KEY_BASE64 GitHub secret}"
          : "${ASC_API_KEY_ID:?Add the ASC_API_KEY_ID GitHub secret}"
          : "${ASC_API_ISSUER_ID:?Add the ASC_API_ISSUER_ID GitHub secret}"

          key_path="$RUNNER_TEMP/AuthKey_${ASC_API_KEY_ID}.p8"
          printf '%s' "$ASC_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          printf 'ASC_API_KEY_PATH=%s\n' "$key_path" >> "$GITHUB_ENV"

      - name: Archive the iOS app
        shell: bash
        run: |
          set -euo pipefail

          workspace="$(python3 -c 'from pathlib import Path; print(next(Path("ios").glob("*.xcworkspace")))')"
          scheme="$(xcodebuild -list -json -workspace "$workspace" | python3 -c 'import json,sys; data=json.load(sys.stdin); schemes=data.get("workspace", {}).get("schemes", []); print(next((item for item in schemes if "Pods-" not in item), ""))')"
          if [[ -z "$scheme" ]]; then
            echo "Could not determine the iOS app scheme from $workspace." >&2
            exit 1
          fi

          echo "Archiving scheme: $scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Ampara.xcarchive" \
            archive \
            CODE_SIGN_STYLE=Manual \
            'CODE_SIGN_IDENTITY=Apple Distribution' \
            "DEVELOPMENT_TEAM=$APPLE_TEAM_ID" \
            "PROVISIONING_PROFILE=$IOS_PROFILE_UUID" \
            "PROVISIONING_PROFILE_SPECIFIER=$IOS_PROFILE_NAME" \
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_ID"

      - name: Export signed IPA
        shell: bash
        run: |
          set -euo pipefail
          export_options="$RUNNER_TEMP/ExportOptions.plist"
          export_path="$RUNNER_TEMP/export"

          python3 - "$export_options" "$APPLE_TEAM_ID" "$IOS_PROFILE_UUID" <<'PY'
          import plistlib
          import sys

          options = {
              "method": "app-store-connect",
              "signingStyle": "manual",
              "teamID": sys.argv[2],
              "provisioningProfiles": {
                  "com.gustavo.ampara": sys.argv[3],
              },
              "uploadSymbols": True,
          }
          with open(sys.argv[1], "wb") as export_options:
              plistlib.dump(options, export_options)
          PY

          xcodebuild \
            -exportArchive \
            -archivePath "$RUNNER_TEMP/Ampara.xcarchive" \
            -exportPath "$export_path" \
            -exportOptionsPlist "$export_options"

          ipa_path="$(python3 - "$export_path" <<'PY'
          from pathlib import Path
          import sys

          ipa_files = list(Path(sys.argv[1]).glob("*.ipa"))
          if len(ipa_files) != 1:
              raise SystemExit(f"Expected exactly one IPA in {sys.argv[1]}, found {len(ipa_files)}")
          print(ipa_files[0])
          PY
          )"
          printf 'IPA_PATH=%s\n' "$ipa_path" >> "$GITHUB_ENV"

      - name: Upload IPA to TestFlight
        shell: bash
        env:
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          BUILD_MESSAGE: ${{ inputs.message }}
        run: |
          set -euo pipefail
          api_key_json="$RUNNER_TEMP/app-store-connect-api-key.json"

          python3 - "$api_key_json" "$ASC_API_KEY_PATH" "$ASC_API_KEY_ID" "$ASC_API_ISSUER_ID" <<'PY'
          import json
          import pathlib
          import sys

          payload = {
              "key_id": sys.argv[3],
              "issuer_id": sys.argv[4],
              "key": pathlib.Path(sys.argv[2]).read_text(),
              "duration": 1200,
              "in_house": False,
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(payload))
          PY

          fastlane pilot upload \
            --api_key_path "$api_key_json" \
            --ipa "$IPA_PATH" \
            --app_identifier com.gustavo.ampara \
            --changelog "$BUILD_MESSAGE" \
            --skip_submission true

      - name: Remove temporary signing keychain
        if: always()
        shell: bash
        run: |
          security delete-keychain "$RUNNER_TEMP/ampara-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/distribution.p12" \
            "$RUNNER_TEMP/app-store.mobileprovision" \
            "$RUNNER_TEMP/app-store-profile.plist" \
            "$RUNNER_TEMP/AuthKey_"*.p8 \
            "$RUNNER_TEMP/app-store-connect-api-key.json"
